{% extends "base.html" %}
{% block title %}New License — Cipher Admin{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">New License</h1>
    <a href="{{ url_for('licenses') }}" class="btn btn-sm">Back to Licenses</a>
</div>

<div class="card" style="max-width:520px;">
    <div class="card-title">License Parameters</div>
    <form method="POST">
        <div class="form-group">
            <label for="expires_days">Duration</label>
            <select id="expires_days" name="expires_days" required>
                <option value="1">1 day</option>
                <option value="7">7 days</option>
                <option value="30" selected>30 days</option>
                <option value="90">90 days</option>
                <option value="180">180 days</option>
                <option value="365">365 days</option>
            </select>
        </div>

        <div class="form-group">
            <label for="max_sessions">Max Concurrent Sessions</label>
            <input type="number" id="max_sessions" name="max_sessions" value="1" min="1" max="10" required>
        </div>

        <div class="form-group">
            <label for="note">Note <span
                    style="font-weight:400; text-transform:none; letter-spacing:0;">(optional)</span></label>
            <textarea id="note" name="note" rows="2" placeholder="Customer name, order reference..."></textarea>
        </div>

        <div style="display:flex; gap:0.75rem; margin-top:0.5rem;">
            <button type="submit" class="btn btn-primary">Generate License</button>
            <a href="{{ url_for('licenses') }}" class="btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
